name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Required for actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.0
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Install Lean and build project
        uses: leanprover/lean-action@434f25c2f80ded67bba02502ad3a86f25db50709 # 2025-07-02
        with:
          build: true
          lint: false
          mk_all-check: false

      - name: Install TeX Live and Graphviz (for blueprint pdf and dep graph)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended \
            texlive-science texlive-xetex latexmk \
            graphviz libgraphviz-dev pkg-config

      - name: Install Python and leanblueprint
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install leanblueprint plastexshowmore plastexdepgraph

      - name: Build blueprint web (HTML)
        run: |
          cd blueprint
          leanblueprint web

      - name: Build blueprint PDF (best-effort; do not fail the build)
        run: |
          cd blueprint
          leanblueprint pdf || echo "PDF build failed; continuing without PDF."

      - name: Refresh find/ redirect map (in case .lean line numbers shifted)
        run: |
          python3 home_page/build_find.py

      - name: Build doc-gen4 documentation (best-effort)
        run: |
          ~/.elan/bin/lake -R -Kenv=dev build PeterWeyl:docs PeterWeylComp:docs \
            || echo "doc-gen4 build failed or not configured; site will deploy without /docs/."

      - name: Assemble _site/
        run: |
          set -eux
          mkdir -p _site

          # 1. Jekyll homepage (acts as site root).  Includes home_page/find/.
          if [ -d home_page ]; then
            cp -r home_page/. _site/
          fi

          # 2. Blueprint HTML at /blueprint/.
          mkdir -p _site/blueprint
          if [ -d blueprint/web ]; then
            cp -r blueprint/web/. _site/blueprint/
          fi

          # 3. Blueprint PDF at /blueprint.pdf (if built).
          if [ -f blueprint/print/print.pdf ]; then
            cp blueprint/print/print.pdf _site/blueprint.pdf
          fi

          # 4. doc-gen4 output at /docs/ (if built).
          if [ -d .lake/build/doc ]; then
            mkdir -p _site/docs
            cp -r .lake/build/doc/. _site/docs/
          fi

          # 5. Sanity diagnostics.
          echo "=== _site/ contents ==="
          ls -la _site/
          echo "=== _site/find/ ==="
          ls -la _site/find/ || echo "(missing)"
          echo "=== _site/blueprint/ (sample) ==="
          ls _site/blueprint/ | head -10
          echo "=== _site/blueprint/dep_graph_document.html present? ==="
          [ -f _site/blueprint/dep_graph_document.html ] && echo "yes" || echo "NO -- broken"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
